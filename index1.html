<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formulaire de Candidature</title>
  <link rel="stylesheet" href="style1.css" />
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Cal+Sans&display=swap");
  </style>
</head>
<body>
  <div class="video-background">
    <video autoplay muted loop playsinline>
      <source src="./img/Fonds animations.mp4" type="video/mp4">
      Votre navigateur ne supporte pas la vidéo HTML5.
    </video>
    <div class="content">
    <header>
      <a href="index.html">
        <a href="index.html"><img src="./img/CNT_Logo_Upscaled_smaller.png" alt="CNT Logo" /></a>
        <div class="dropdown">
          <div class="trigger">
            <div class="hamburger">
              <span></span>
              <span></span>
              <span></span>
            </div>
          </div>
          <div class="dropdown-content">
            <button id="articles"><a href="https://x.com/CNT1689645">Publications</a></button>
            <button id="postuler"><a href="postuler.html">Postuler</a></button>
            <button id="apropos"><a href="apropos.html">À propos</a></button>
            <button id="contactez"><a href="index.html#contact ">Nous contacter</a></button>
          </div>
        </div>
      </header>
      <br><br>
  <main>
    <h1>Formulaire de Candidature</h1>
    <form id="applicationForm">
      <label for="name">Nom</label>
      <input type="text" id="name" name="name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" required>

      <label for="motivation">Motivation</label>
      <textarea id="motivation" name="motivation" rows="4"  required></textarea>

      <button type="submit">Envoyer</button>
    </form>
  </main>
  <br>
  <footer>
    <br>
    &copy; 2025 Conglomerat National Television. Tous droits réservés. | contact@cnt.fr
    <br>
    <br>
  </footer>
</div>
<div class="cursor-ball"></div>
  <script src="script.js"></script>
</body>
</html>
